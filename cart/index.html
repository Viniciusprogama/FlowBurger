<!DOCTYPE html>
<html lang="pt-br" translate="no">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/jpg" href="https://i.postimg.cc/T3hr6XvR/logo.webp">
    <title>Carrinho - Flow Burger</title>
    <link type="text/css" href="../css/delivry.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9 !important; }

        .cart-header {
            background: linear-gradient(135deg, #ef1d2c, #d51421);
            color: white;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(239, 29, 44, 0.35);
        }
        .cart-header h1 { margin: 0; font-size: 19px; font-weight: 700; }
        .cart-header small { display: inline-block; margin-top: 2px; font-size: 12px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); padding: 2px 10px; border-radius: 999px; }
        .back-button { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 40px; height: 40px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .back-button:hover { background: rgba(255, 255, 255, 0.32); }

        .cart-container { max-width: 860px; margin: 22px auto 40px; padding: 0 20px; }

        .empty-cart { text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border-top: 5px solid #ef1d2c; box-shadow: 0 6px 20px rgba(16, 24, 40, 0.08); }
        .empty-cart i { font-size: 64px; color: #ef1d2c; margin-bottom: 20px; }
        .empty-cart h2 { color: #1b2130; margin-bottom: 10px; }
        .empty-cart p { color: #7a8194; margin-bottom: 30px; }
        .empty-cart .btn { display: inline-block; background: #ef1d2c; color: #fff; padding: 13px 30px; border-radius: 12px; font-weight: 600; text-decoration: none; }
        .empty-cart .btn:hover { background: #d51421; }

        .cart-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 5px solid #ef1d2c;
            box-shadow: 0 6px 18px rgba(16, 24, 40, 0.10);
        }
        .item-img { width: 92px; height: 92px; object-fit: cover; border-radius: 12px; background: #fff3f4; flex-shrink: 0; display: block; }
        .item-img-fallback { width: 92px; height: 92px; border-radius: 12px; background: linear-gradient(135deg, #ef1d2c, #d51421); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; flex-shrink: 0; }
        .item-body { flex: 1; min-width: 0; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .item-title { font-size: 17px; font-weight: 600; color: #1b2130; margin: 0; line-height: 1.3; overflow-wrap: anywhere; }
        .item-unit { font-size: 13px; color: #7a8194; margin-top: 3px; }
        .item-price { font-size: 21px; font-weight: 700; color: #111827; white-space: nowrap; }

        .item-details { margin: 12px 0 0; }
        .detail-item { color: #4b5563; font-size: 15px; margin: 5px 0; }
        .detail-item b { color: #077c22; font-weight: 600; }

        .item-observations { background: #f4f6f9; border-left: 3px solid #ef1d2c; padding: 10px 12px; border-radius: 8px; margin: 12px 0 0; font-style: italic; color: #4b5563; font-size: 14px; overflow-wrap: anywhere; }

        .item-controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .quantity-controls { display: flex; align-items: center; border: 1.5px solid #e3e7ee; border-radius: 10px; overflow: hidden; background: #fff; }
        .qty-btn { width: 40px; height: 40px; background: #f7f8fa; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1b2130; font-size: 18px; font-weight: 700; }
        .qty-btn:hover { background: #ef1d2c; color: white; }
        .qty-display { width: 52px; text-align: center; font-weight: 700; font-size: 16px; background: white; border: none; padding: 9px 0; color: #1b2130; }
        .remove-item { background: #ef1d2c; color: white; border: none; padding: 11px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .remove-item:hover { background: #d51421; }

        .cart-summary {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-top: 28px;
            border-top: 5px solid #ef1d2c;
            box-shadow: 0 8px 24px rgba(16, 24, 40, 0.12);
        }
        .cart-summary h3 { color: #1b2130; margin: 0 0 16px 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .cart-summary h3 i { color: #ef1d2c; }
        .summary-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 16px; color: #4b5563; }
        .summary-row span:last-child { color: #1b2130; font-weight: 600; }
        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            font-weight: 700;
            color: #1b2130;
            background: #fff1f2;
            border: 1px solid #ffd3d7;
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 16px;
        }
        .summary-total span:last-child { font-size: 28px; color: #ef1d2c; font-weight: 800; white-space: nowrap; }
        .checkout-btn {
            width: 100%;
            background: linear-gradient(120deg, #ef1d2c, #d51421);
            color: white;
            border: none;
            padding: 17px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            box-shadow: 0 10px 22px rgba(239, 29, 44, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 26px rgba(239, 29, 44, 0.42); }
        .checkout-btn i { margin-left: 8px; }

        .continue-shopping { display: block; text-align: center; color: #ef1d2c; text-decoration: none; margin: 22px 0 0; font-weight: 600; }
        .continue-shopping:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .cart-container { padding: 0 14px; margin-top: 16px; }
            .cart-item { padding: 14px; gap: 12px; }
            .item-img, .item-img-fallback { width: 74px; height: 74px; }
            .item-img-fallback { font-size: 28px; }
            .item-header { flex-direction: column; gap: 4px; }
            .item-price { font-size: 20px; }
            .item-controls { flex-direction: column; align-items: stretch; }
            .quantity-controls { justify-content: space-between; }
            .cart-summary { position: sticky; bottom: 12px; z-index: 5; padding: 18px; }
            .summary-total span:last-child { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Cabeçalho -->
    <div class="cart-header">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div style="flex: 1; text-align: center;">
                <h1>Meu Carrinho</h1>
                <small>Flow Burger <span id="cart-count"></span></small>
            </div>
            <div style="width: 40px;"></div>
        </div>
    </div>

    <div class="cart-container">
        <!-- Carrinho vazio -->
        <div class="empty-cart" id="empty-cart" style="display: none;">
            <i class="fas fa-shopping-cart"></i>
            <h2>Seu carrinho está vazio</h2>
            <p>Que tal escolher alguns dos nossos deliciosos hambúrgueres?</p>
            <a href="../index.html" class="btn">Ver Cardápio</a>
        </div>

        <!-- Itens do carrinho -->
        <div id="cart-items"></div>

        <!-- Resumo do carrinho -->
        <div class="cart-summary" id="cart-summary" style="display: none;">
            <h3><i class="fas fa-receipt"></i> Resumo do Pedido</h3>
            <div id="summary-details"></div>
            <div class="summary-total">
                <span>Total</span>
                <span id="final-total">R$ 0,00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">
                Finalizar Pedido <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <a href="../index.html" class="continue-shopping">
            <i class="fas fa-arrow-left"></i> Continuar Comprando
        </a>
    </div>

    <script>
        let cart = [];

        function esc(value) {
            return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function fmt(value) {
            if (typeof window.formatPrice === 'function') return window.formatPrice(value);
            return 'R$ ' + value.toFixed(2).replace('.', ',');
        }

        function goBack() {
            window.history.back();
        }

        function loadCart() {
            cart = JSON.parse(localStorage.getItem('cart') || '[]');
            renderCart();
        }

        function itemImage(item) {
            const productId = item.productId || item.id;
            return '../imgs/' + encodeURIComponent(String(productId)) + '.webp';
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const emptyCart = document.getElementById('empty-cart');
            const cartSummary = document.getElementById('cart-summary');

            if (cart.length === 0) {
                emptyCart.style.display = 'block';
                cartSummary.style.display = 'none';
                cartItemsContainer.innerHTML = '';
                const count = document.getElementById('cart-count');
                if (count) count.textContent = '';
                return;
            }

            emptyCart.style.display = 'none';
            cartSummary.style.display = 'block';

            let cartHTML = '';
            cart.forEach((item, index) => {
                const lineTotal = item.totalPrice * item.quantity;
                cartHTML += `
                    <div class="cart-item">
                        <img class="item-img" src="${itemImage(item)}" alt="${esc(item.productName)}">
                        <div class="item-body">
                            <div class="item-header">
                                <div>
                                    <h3 class="item-title">${esc(item.productName)}</h3>
                                    ${item.quantity > 1 ? `<div class="item-unit">${fmt(item.totalPrice)} un. &times; ${item.quantity}</div>` : ''}
                                </div>
                                <div class="item-price">${fmt(lineTotal)}</div>
                            </div>

                            <div class="item-details">
                                ${generateItemDetails(item)}
                            </div>

                            ${item.observations ? `<div class="item-observations">"${esc(item.observations)}"</div>` : ''}

                            <div class="item-controls">
                                <div class="quantity-controls">
                                    <button class="qty-btn" onclick="changeItemQuantity(${index}, -1)" aria-label="Diminuir">-</button>
                                    <input type="number" class="qty-display" value="${item.quantity}" readonly>
                                    <button class="qty-btn" onclick="changeItemQuantity(${index}, 1)" aria-label="Aumentar">+</button>
                                </div>
                                <button class="remove-item" onclick="removeItem(${index})">
                                    <i class="fas fa-trash"></i> Remover
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = cartHTML;

            cartItemsContainer.querySelectorAll('img.item-img').forEach(img => {
                img.addEventListener('error', function () {
                    const fallback = document.createElement('div');
                    fallback.className = 'item-img-fallback';
                    fallback.textContent = (img.alt || 'B').trim().charAt(0).toUpperCase();
                    img.replaceWith(fallback);
                });
            });

            renderSummary();
        }

        function generateItemDetails(item) {
            let details = '';
            
            // Opções selecionadas
            if (item.selectedOptions) {
                Object.values(item.selectedOptions).forEach(option => {
                    if (option.name) {
                        details += `<div class="detail-item">• ${esc(option.name)}</div>`;
                    }
                });
            }
            
            // Complementos
            if (item.selectedComplements) {
                Object.values(item.selectedComplements).forEach(complement => {
                    details += `<div class="detail-item">• ${esc(complement.name)} (${complement.quantity}x) - <b>+${fmt(complement.price * complement.quantity)}</b></div>`;
                });
            }
            
            return details;
        }

        function renderSummary() {
            const summaryDetails = document.getElementById('summary-details');
            const finalTotal = document.getElementById('final-total');
            const cartCount = document.getElementById('cart-count');
            
            let subtotal = 0;
            let itemCount = 0;
            
            cart.forEach(item => {
                subtotal += item.totalPrice * item.quantity;
                itemCount += item.quantity;
            });
            
            const deliveryFee = 0; // Frete grátis
            const total = subtotal + deliveryFee;
            
            if (cartCount) {
                cartCount.textContent = '| ' + itemCount + (itemCount === 1 ? ' item' : ' itens');
            }
            
            summaryDetails.innerHTML = `
                <div class="summary-row">
                    <span>Subtotal (${itemCount} ${itemCount === 1 ? 'item' : 'itens'})</span>
                    <span>${fmt(subtotal)}</span>
                </div>
                <div class="summary-row">
                    <span>Taxa de entrega</span>
                    <span style="color: #077c22;">Grátis</span>
                </div>
            `;
            
            finalTotal.textContent = fmt(total);
        }

        function changeItemQuantity(index, change) {
            const newQuantity = cart[index].quantity + change;
            
            if (newQuantity <= 0) {
                removeItem(index);
                return;
            }
            
            cart[index].quantity = newQuantity;
            saveCart();
            renderCart();
        }

        function removeItem(index) {
            if (confirm('Tem certeza que deseja remover este item do carrinho?')) {
                cart.splice(index, 1);
                saveCart();
                renderCart();
            }
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Adicione pelo menos um produto ao pedido.');
                return;
            }

            window.location.href = '../checkout/index.html';
        }

        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
        });
    </script>
</body>
</html>
